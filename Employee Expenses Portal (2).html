function flt(){var q=st.q.toLowerCase();return R.filter(function(r){return(st.s===""||r[2]==st.s)&&(st.c===""||r[7]==st.c)&&(st.p===""||r[6]==st.p)&&(!q||(D.E[r[0]]+" "+r[1]+" "+D.T[r[3]]).toLowerCase().indexOf(q)>-1)})}
function sum(a,fn){return a.reduce(function(t,r){return t+(fn?fn(r):r[4])},0)}
function grp(a,i,n){var o=[];for(var k=0;k<n;k++)o.push([0,0]);a.forEach(function(r){o[r[i]][0]+=r[4];o[r[i]][1]++});return o}
function bars(g,labels,cols,tot){var mx=Math.max.apply(null,g.map(function(x){return x[0]}).concat([1]));return g.map(function(x,i){return '<div class="row"><div>'+h(labels[i])+'<div class="mu">'+x[1]+' lines</div></div><div class="track"><div class="fill" style="width:'+x[0]/mx*100+"%;background:"+cols[i%cols.length]+'"></div></div><div class="num">'+f(x[0])+'<div class="mu">'+pc(x[0],tot)+"</div></div></div>"}).join("")}
function kp(a){var t=sum(a),pd=sum(a.filter(function(r){return r[2]==0}));var n={};a.forEach(function(r){n[r[0]]=1});
return[["Total expenses","PKR "+f(t)],["Employees",Object.keys(n).length],["Expense lines",a.length],["Paid","PKR "+f(pd)],["Not yet paid","PKR "+f(t-pd)]].map(function(k){return '<div class="card"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+"</div></div>"}).join("")}
function overview(a){var t=sum(a);return '<div class="kpis">'+kp(a)+'</div><div class="g2"><div class="card"><h2>By category</h2>'+bars(grp(a,7,D.C.length),D.C,CC,t)+'</div><div class="card"><h2>By report status</h2>'+bars(grp(a,2,D.S.length),D.S,SC,t)+'</div><div class="card"><h2>By accounting period</h2>'+bars(grp(a,6,D.P.length),D.P,["#1f6feb"],t)+'</div><div class="card"><h2>Top 5 employees</h2>'+emps(a).slice(0,5).map(function(e){return '<div class="row"><div>'+h(D.E[e.i])+'</div><div class="track"><div class="fill" style="width:'+e.t/(emps(a)[0].t||1)*100+'%;background:var(--ac)"></div></div><div class="num">'+f(e.t)+"</div></div>"}).join("")+"</div></div>"}
function emps(a){var m={};a.forEach(function(r){var e=m[r[0]]||(m[r[0]]={i:r[0],t:0,p:0,n:0});e.t+=r[4];e.n++;if(r[2]==0)e.p+=r[4]});return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.t-x.t})}
function employees(a){var l=emps(a),t=sum(a);if(!l.length)return '<div class="card empty">No matching records</div>';
return '<div class="card"><div class="wrap"><table><thead><tr><th>Employee</th><th class="num">Lines</th><th class="num">Paid</th><th class="num">Not yet paid</th><th class="num">Total</th><th class="num">Share</th></tr></thead><tbody>'+l.map(function(e){return '<tr class="cl" data-e="'+e.i+'"><td>'+h(D.E[e.i])+'</td><td class="num">'+e.n+'</td><td class="num">'+f(e.p)+'</td><td class="num">'+f(e.t-e.p)+'</td><td class="num">'+f(e.t)+'</td><td class="num">'+pc(e.t,t)+"</td></tr>"}).join("")+'</tbody></table></div><p class="mu">Select an employee to see their transactions.</p></div>'}
var CO=["Employee","Purpose","Type","Category","Amount","Status","Paid on"];
function tx(a){if(!a.length)return '<div class="card empty">No matching records</div>';
var m=st.asc?1:-1,k=st.sk;a=a.slice().sort(function(x,y){var A=[x[0],x[1],x[3],x[7],x[4],x[2],x[5]][k],B=[y[0],y[1],y[3],y[7],y[4],y[2],y[5]][k];if(k==0){A=D.E[A];B=D.E[B]}if(k==2){A=D.T[A];B=D.T[B]}if(k==3){A=D.C[A];B=D.C[B]}return typeof A=="string"?m*A.localeCompare(B):m*(A-B)});
var sh=a.slice(0,st.lim);
return '<div class="card"><p class="mu">'+a.length+" lines · PKR "+f(sum(a))+'</p><div class="wrap"><table><thead><tr>'+CO.map(function(c,i){return '<th data-k="'+i+'"'+(i==4?' class="num"':"")+">"+c+(i==k?(st.asc?" ▲":" ▼"):"")+"</th>"}).join("")+"</tr></thead><tbody>"+sh.map(function(r){return "<tr><td>"+h(D.E[r[0]])+"</td><td>"+(h(r[1])||"–")+"</td><td>"+h(D.T[r[3]])+"</td><td>"+h(D.C[r[7]])+'</td><td class="num">'+f(r[4])+'</td><td><span class="pill" style="background:'+SC[r[2]]+'">'+h(D.S[r[2]])+"</span></td><td>"+dt(r[5])+"</td></tr>"}).join("")+"</tbody></table></div>"+(a.length>st.lim?'<p><button class="btn" id="more">Show more ('+(a.length-st.lim)+" left)</button></p>":"")+"</div>"}
function draw(){$("nav").innerHTML=V.map(function(v){return '<button data-v="'+v[0]+'"'+(v[0]==st.v?' class="on"':"")+">"+v[1]+"</button>"}).join("");
$("ttl").textContent=V.filter(function(v){return v[0]==st.v})[0][1];var a=flt();
$("out").innerHTML=st.v=="overview"?overview(a):st.v=="employees"?employees(a):tx(a);
var m=$("more");if(m)m.onclick=function(){st.lim+=100;draw()};
Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(t){t.onclick=function(){var i=+t.dataset.k;if(i==st.sk)st.asc=!st.asc;else{st.sk=i;st.asc=i<4}draw()}});
Array.prototype.forEach.call(document.querySelectorAll("tr[data-e]"),function(t){t.onclick=function(){st.q=D.E[t.dataset.e];$("q").value=st.q;go("transactions")}})}
function go(v){st.v=v;st.lim=100;draw()}
$("nav").onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v)go(v)};
$("fs").onchange=function(){st.s=this.value;st.lim=100;draw()};$("fc").onchange=function(){st.c=this.value;st.lim=100;draw()};$("fp").onchange=function(){st.p=this.value;st.lim=100;draw()};
$("q").oninput=function(){st.q=this.value;st.lim=100;draw()};
$("rs").onclick=function(){st.s=st.c=st.p=st.q="";$("fs").value=$("fc").value=$("fp").value=$("q").value="";st.lim=100;draw()};
var hv=(location.hash||"").slice(1);if(V.some(function(v){return v[0]==hv}))st.v=hv;draw();
</script></body></html>
